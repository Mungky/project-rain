[project]
name = "rain-backend"
version = "0.1.0"
description = "Rain Backend API"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Project Rain Team"}]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    # Database
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    # HTTP client
    "httpx>=0.25.0",
    # Cache
    "redis>=5.0.0",
    # Vector
    "qdrant-client>=1.6.0",
    # Object Storage
    "minio>=7.2.0",
    # LLM providers
    "ollama>=0.1.0",
    "anthropic>=0.18.0",
    "openai>=1.12.0",
    "google-generativeai>=0.3.0",
    # Observability (optional — gracefully disabled if keys not set)
    "langfuse>=2.0.0",
    # Auth
    "PyJWT>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=3.2.0,<4",
    # Google Drive + Gmail (Nimbus)
    "google-api-python-client>=2.100.0",
    "google-auth>=2.23.0",
    "google-auth-httplib2>=0.1.1",
    "google-auth-oauthlib>=1.2.0",
    # Multipart form data
    "python-multipart>=0.0.6",
    # Environment
    "pydantic-settings>=2.1.0",
    "pypdf>=6.10.2",
    "python-docx>=1.2.0",
    "pandas>=3.0.2",
    "openpyxl>=3.1.5",
    # Workspace packages
    "rain-db",
    "rain-brain",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Use uv for dependency management

[tool.uv.sources]
rain-db = { workspace = true }
rain-brain = { workspace = true }

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line too long, handled by black
    "F841",  # unused variable (allow for type-checking)
    "B008",  # function call with mutable default arg (allow for FastAPI Depends)
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = true
exclude = [
    ".venv",
    "build",
    "dist",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-httpx>=0.27.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
    "black>=23.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
