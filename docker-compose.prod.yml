# =============================================================================
# Project Rain — Production (Coolify deployment)
# =============================================================================
# Used by Coolify on system.restard.org for the backend stack.
# Frontend (workshop-web) lives on Vercel — NOT deployed here.
# Code-server NOT included for production (security).
#
# Deploy:
#   - In Coolify: New Resource > Docker Compose > select this file
#   - Assign domain api.rain.restard.org to the rain-api service (port 8000)
#   - Paste env vars from .env.production.example into Coolify env tab
# =============================================================================

x-restart-policy: &restart unless-stopped

x-healthcheck-defaults: &hc-defaults
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 20s

x-datastore-env: &datastore-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: rain
  POSTGRES_USER: rain
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DSN: postgresql+asyncpg://rain:${POSTGRES_PASSWORD}@postgres:5432/rain
  REDIS_URL: redis://redis:6379/0
  QDRANT_URL: http://qdrant:6333
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
  MINIO_SECURE: "false"

services:

  # --- DATASTORES (internal only, no host port binding) ---

  postgres:
    image: postgres:16-alpine
    restart: *restart
    environment:
      POSTGRES_DB: rain
      POSTGRES_USER: rain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "max_connections=50"
      - "-c"
      - "wal_buffers=8MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "log_min_duration_statement=500"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    mem_limit: 1536m
    mem_reservation: 512m
    healthcheck:
      <<: *hc-defaults
      test: ["CMD-SHELL", "pg_isready -U rain -d rain"]

  redis:
    image: redis:7-alpine
    restart: *restart
    command:
      - "redis-server"
      - "--maxmemory"
      - "384mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--appendonly"
      - "no"
      - "--save"
      - ""
    expose:
      - "6379"
    mem_limit: 512m
    mem_reservation: 128m
    healthcheck:
      <<: *hc-defaults
      test: ["CMD", "redis-cli", "ping"]

  qdrant:
    image: qdrant/qdrant:latest
    restart: *restart
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__STORAGE__OPTIMIZERS__DEFAULT_SEGMENT_NUMBER: 2
      QDRANT__STORAGE__OPTIMIZERS__MAX_OPTIMIZATION_THREADS: 1
      QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS: 2
    volumes:
      - qdrant_data:/qdrant/storage
    expose:
      - "6333"
      - "6334"
    mem_limit: 1536m
    mem_reservation: 512m
    healthcheck:
      <<: *hc-defaults
      start_period: 30s
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' || exit 1"]

  minio:
    image: minio/minio:latest
    restart: *restart
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    expose:
      - "9000"
      - "9001"
    mem_limit: 512m
    mem_reservation: 128m
    healthcheck:
      <<: *hc-defaults
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]

  # --- APPLICATION SERVICE (publicly exposed via Coolify/Traefik) ---

  rain-api:
    build:
      context: .
      dockerfile: apps/rain-api/Dockerfile
    restart: *restart
    environment:
      <<: *datastore-env
      ENVIRONMENT: production
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: "8000"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # LLM providers
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-https://ollama.com}
      OLLAMA_DEFAULT_MODEL: ${OLLAMA_DEFAULT_MODEL:-kimi-k2.6:cloud}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      OLLAMA_EXTRACTION_MODEL: ${OLLAMA_EXTRACTION_MODEL:-gemma4:31b-cloud}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      # CORS / public URLs
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://rain.restard.org}
      BACKEND_ORIGIN: ${BACKEND_ORIGIN:-https://api.rain.restard.org}
      # Persona models
      DRIZZLE_DEFAULT_MODEL: ${DRIZZLE_DEFAULT_MODEL:-kimi-k2.6:cloud}
      SHOWER_DEFAULT_MODEL: ${SHOWER_DEFAULT_MODEL:-}
      STORM_DEFAULT_MODEL: ${STORM_DEFAULT_MODEL:-}
      # Nimbus (Google Drive + Gmail)
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${GOOGLE_OAUTH_REFRESH_TOKEN:-}
      NIMBUS_DRIVE_ROOT_FOLDER_ID: ${NIMBUS_DRIVE_ROOT_FOLDER_ID:-}
      GMAIL_SENDER: ${GMAIL_SENDER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      # Observability
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
      # Security
      API_BEARER_TOKEN: ${API_BEARER_TOKEN:-}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-}
      ENABLE_PYTHON_EXECUTOR: ${ENABLE_PYTHON_EXECUTOR:-false}
      ENABLE_SKILL_INSTALL: ${ENABLE_SKILL_INSTALL:-false}
    volumes:
      - sandboxes:/app/sandboxes
    expose:
      - "8000"
    ports:
      - "8000"
    mem_limit: 2048m
    mem_reservation: 512m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      <<: *hc-defaults
      start_period: 30s
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]

  # --- SKILLS INFRA (optional — enable if web search needed) ---

  searxng:
    image: searxng/searxng:latest
    restart: *restart
    environment:
      SEARXNG_SETTINGS_PATH: /etc/searxng/settings.yml
    volumes:
      - ./searxng:/etc/searxng:rw
    expose:
      - "8080"
    mem_limit: 512m
    mem_reservation: 128m
    healthcheck:
      <<: *hc-defaults
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]

volumes:
  postgres_data:
  qdrant_data:
  minio_data:
  sandboxes:
    driver: local
