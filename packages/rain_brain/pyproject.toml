[project]
name = "rain-brain"
version = "0.1.0"
description = "LLM orchestration, providers, and services for Project Rain"
requires-python = ">=3.11"
dependencies = [
    # Database
    "sqlalchemy>=2.0",
    "asyncpg>=0.29.0",
    # HTTP client
    "httpx>=0.25.0",
    # Cache
    "redis>=5.0.0",
    # Vector
    "qdrant-client>=1.6.0",
    # Object Storage
    "minio>=7.2.0",
    # LLM providers
    "ollama>=0.1.0",
    "anthropic>=0.18.0",
    "openai>=1.12.0",
    "google-generativeai>=0.3.0",
    # Observability
    "langfuse>=2.0.0",
    # Pydantic
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    # Workspace dependencies
    "rain-db",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv.sources]
rain-db = { workspace = true }
