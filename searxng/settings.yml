# SearXNG settings for Project Rain
# Managed by Parent Agent

use_default_settings: true

general:
  debug: false
  instance_title: "Rain Search"

server:
  secret_key: "rain-searxng-secret-change-in-production"
  limiter: false
  public_instance: false
  image_proxy: false
  port: 8080
  bind_address: "0.0.0.0"

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "id-ID"
  formats:
    - html
    - json

engines:
  - name: google
    engine: google
    shortcut: g
    disabled: false

  - name: duckduckgo
    engine: duckduckgo
    shortcut: d
    disabled: false

  - name: bing
    engine: bing
    shortcut: b
    disabled: false

  - name: wikipedia
    engine: wikipedia
    shortcut: w
    disabled: false

  - name: brave
    engine: brave
    shortcut: br
    disabled: false

ui:
  static_use_hash: true
  default_locale: ""
  query_in_title: false
  infinite_scroll: false
  center_alignment: false
  default_theme: simple
  theme_args:
    simple_style: auto
