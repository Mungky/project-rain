# =============================================================================
# Project Rain — Local Development (Infrastructure Only)
# =============================================================================
# Start:  docker compose -f docker-compose.dev.yml up -d
# Then:   ./dev.sh  (or manually: bun run dev from root)
#
# This compose file only runs the infrastructure services.
# rain-api and workshop-web run locally via bun for hot-reload.
# =============================================================================

x-restart-policy: &restart unless-stopped

x-healthcheck-defaults: &hc-defaults
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 20s

services:

  postgres:
    image: postgres:16-alpine
    container_name: rain-postgres
    restart: *restart
    environment:
      POSTGRES_DB: rain
      POSTGRES_USER: rain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rain}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    command:
      - "postgres"
      - "-c" "shared_buffers=256MB"
      - "-c" "effective_cache_size=768MB"
      - "-c" "work_mem=16MB"
      - "-c" "maintenance_work_mem=64MB"
      - "-c" "max_connections=50"
      - "-c" "wal_buffers=8MB"
      - "-c" "checkpoint_completion_target=0.9"
      - "-c" "random_page_cost=1.1"
      - "-c" "log_min_duration_statement=500"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    mem_limit: 1536m
    mem_reservation: 512m
    healthcheck:
      <<: *hc-defaults
      test: ["CMD-SHELL", "pg_isready -U rain -d rain"]

  redis:
    image: redis:7-alpine
    container_name: rain-redis
    restart: *restart
    command:
      - "redis-server"
      - "--maxmemory" "384mb"
      - "--maxmemory-policy" "allkeys-lru"
      - "--appendonly" "no"
      - "--save" ""
    ports:
      - "127.0.0.1:6379:6379"
    mem_limit: 512m
    mem_reservation: 128m
    healthcheck:
      <<: *hc-defaults
      test: ["CMD", "redis-cli", "ping"]

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rain-qdrant
    restart: *restart
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__STORAGE__OPTIMIZERS__DEFAULT_SEGMENT_NUMBER: 2
      QDRANT__STORAGE__OPTIMIZERS__MAX_OPTIMIZATION_THREADS: 1
      QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS: 2
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    mem_limit: 1536m
    mem_reservation: 512m
    healthcheck:
      <<: *hc-defaults
      start_period: 30s
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' || exit 1"]

  minio:
    image: minio/minio:latest
    container_name: rain-minio
    restart: *restart
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-rain}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-rainminio}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    mem_limit: 512m
    mem_reservation: 128m
    healthcheck:
      <<: *hc-defaults
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]

  code-server:
    build:
      context: .docker/code-server
      dockerfile: Dockerfile
    container_name: rain-code-server
    restart: *restart
    environment:
      PASSWORD: ""
      DOCKER_USER: coder
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - sandboxes:/home/coder/sandboxes
      - code_server_config:/home/coder/.config
      - code_server_extensions:/home/coder/.local/share/code-server/extensions
    mem_limit: 2048m
    mem_reservation: 512m

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
  sandboxes:
    driver: local
    name: rain-sandboxes
  code_server_config:
    name: rain-code-server-config
  code_server_extensions:
    name: rain-code-server-extensions
